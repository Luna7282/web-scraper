[project]
name = "scraper"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crawl4ai==0.9.2",
    "aiofiles==25.1.0",
    "pydantic==2.13.4",
    "langchain-core==1.5.5",
    "langchain-text-splitters==1.1.2",
    "langchain-chroma==1.1.0",
    "langchain-openai==1.5.1",
    "rich==15.0.0",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    # Load-bearing upper bounds, not exact pins -- see LESSONS_LEARNED.md #1.
    # NumPy 2.x breaks this stack; urllib3 2.x was pinned alongside it.
    "numpy<2",
    "urllib3<2.0.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
